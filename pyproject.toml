[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai6130-kl-anchors"
version = "0.1.0"
description = "Reproducible vulnerability-guided KL anchoring study"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "accelerate>=1.4,<2",
  "datasets>=3.6,<5",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "peft>=0.15,<1",
  "safetensors>=0.5,<1",
  "sentence-transformers>=4,<7",
  "torch>=2.5,<3",
  "transformers>=4.57,<5",
]

[project.optional-dependencies]
cuda-quantized = ["bitsandbytes>=0.45,<1"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/kl_anchors"]
